name: product-bakeoff-b25-terminal-archive

on:
  pull_request:
    branches: [main]
    paths:
      - 'eval/product_bakeoff_b25_*.py'
      - 'eval/product_bakeoff_terminal_archive.py'
      - 'scripts/product_bakeoff_b25_linux_longrun.sh'
      - 'artifacts/product_bakeoff_b25_protocol/**'
      - 'artifacts/product_bakeoff_b25_runtime_qualification/**'
      - 'artifacts/product_bakeoff_b25_readiness/**'
      - 'docs/en/product-bakeoff-b25-fresh-tokenizer-qualified-holdout.md'
      - 'docs/zh/product-bakeoff-b25-fresh-tokenizer-qualified-holdout.md'
      - 'docs/current-research-conclusions.md'
      - '.github/workflows/product-bakeoff-b25-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  terminal-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out public B2.5 contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Compile terminal B2.5 archive tooling
        run: |
          python3 -m py_compile \
            eval/product_bakeoff_terminal_archive.py \
            eval/product_bakeoff_b25_failure_closeout.py
      - name: Validate terminal B2.5 archive and closeout
        run: |
          python3 eval/product_bakeoff_terminal_archive.py --self-test
          python3 eval/product_bakeoff_terminal_archive.py --fault-test
          python3 eval/product_bakeoff_terminal_archive.py --validate b25
          python3 eval/product_bakeoff_b25_failure_closeout.py --self-test
          python3 eval/product_bakeoff_b25_failure_closeout.py --fault-test
          python3 eval/product_bakeoff_b25_failure_closeout.py \
            --validate-public \
            artifacts/product_bakeoff_b25/product_bakeoff_b25_failed_closed_aggregate.json
      - name: Validate disconnect-safe Linux launcher
        run: |
          bash -n scripts/product_bakeoff_b25_linux_longrun.sh
          bash scripts/product_bakeoff_b25_linux_longrun.sh --self-test
      - name: Validate privacy and bilingual documentation
        run: |
          python3 scripts/public_artifact_privacy_audit.py --self-test
          python3 scripts/public_artifact_privacy_audit.py
          python3 scripts/validate_docs_i18n.py
      - name: Check formatting
        run: git diff --check
